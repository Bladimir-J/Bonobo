<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- el token va en la URL: que no se filtre a otras webs en el Referer -->
    <meta name="referrer" content="no-referrer" />
    <title>BONOBO — Nueva contraseña</title>
    <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

    <header id="nav-placeholder"></header>

    <div class="form-pagina">
        <div class="form-caja">

            <h1 class="form-titulo">Nueva contraseña</h1>
            <p class="form-subtitulo">Elige una contraseña nueva para tu cuenta.</p>

            <form id="formRestablecer">

                <div class="form-grupo">
                    <label class="form-label" for="password">Contraseña nueva</label>
                    <input
                        class="form-input" type="password" id="password" placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password"
                        minlength="8" maxlength="128"
                        required
                    />
                </div>

                <div class="form-grupo">
                    <label class="form-label" for="password2">Repite la contraseña</label>
                    <input
                        class="form-input" type="password" id="password2" placeholder="Escríbela otra vez"
                        autocomplete="new-password"
                        minlength="8" maxlength="128"
                        required
                    />
                </div>

                <p class="form-error" id="errorMsg"></p>
                <p class="form-exito" id="exitoMsg"></p>

                <button class="btn btn--primary form-btn" type="submit" id="btnGuardar">
                    Guardar contraseña
                </button>

            </form>

            <p class="form-footer" id="footerOlvide">
                ¿El enlace ha caducado? <a href="olvide-password.html">Pide uno nuevo</a>
            </p>

        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNav('../');

            const form = document.getElementById('formRestablecer');
            const btn = document.getElementById('btnGuardar');
            const errorEl = document.getElementById('errorMsg');
            const exitoEl = document.getElementById('exitoMsg');

            const token = new URLSearchParams(window.location.search).get('token');

            function mostrarError(msg) {
                errorEl.textContent = msg;
                errorEl.className = 'form-error form-error--visible';
            }

            if (!token) {
                mostrarError('Este enlace no es válido. Pide uno nuevo desde "¿Olvidaste tu contraseña?".');
                btn.disabled = true;
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.className = 'form-error';

                const password = document.getElementById('password').value;
                const password2 = document.getElementById('password2').value;

                if (password.length < 8) {
                    mostrarError('La contraseña debe tener al menos 8 caracteres');
                    return;
                }
                if (password !== password2) {
                    mostrarError('Las contraseñas no coinciden');
                    return;
                }

                btn.textContent = 'Guardando…';
                btn.disabled = true;

                try {
                    const data = await api.auth.restablecerPassword(token, password);
                    exitoEl.textContent = data.message + ' Te llevamos al inicio de sesión…';
                    exitoEl.className = 'form-exito form-exito--visible';
                    btn.textContent = 'Contraseña guardada';
                    document.getElementById('footerOlvide').style.display = 'none';
                    setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                } catch (err) {
                    mostrarError(err.message || 'No se ha podido cambiar la contraseña');
                    btn.textContent = 'Guardar contraseña';
                    btn.disabled = false;
                }
            });
        });
    </script>

</body>
</html>
