<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BONOBO — Recuperar contraseña</title>
    <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

    <header id="nav-placeholder"></header>

    <div class="form-pagina">
        <div class="form-caja">

            <h1 class="form-titulo">¿Olvidaste tu contraseña?</h1>
            <p class="form-subtitulo">Escribe el email de tu cuenta y te enviaremos un enlace para elegir una nueva.</p>

            <form id="formOlvide">

                <div class="form-grupo">
                    <label class="form-label" for="email">Email</label>
                    <input
                        class="form-input" type="email" id="email" placeholder="tucorreo@ejemplo.com"
                        autocomplete="email"
                        required
                    />
                </div>

                <p class="form-error" id="errorMsg"></p>
                <p class="form-exito" id="exitoMsg"></p>

                <button class="btn btn--primary form-btn" type="submit" id="btnEnviar">
                    Enviar enlace
                </button>

            </form>

            <p class="form-footer">
                ¿Te has acordado? <a href="login.html">Inicia sesión</a>
            </p>

        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNav('../');

            const form = document.getElementById('formOlvide');
            const btn = document.getElementById('btnEnviar');
            const errorEl = document.getElementById('errorMsg');
            const exitoEl = document.getElementById('exitoMsg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.className = 'form-error';
                exitoEl.className = 'form-exito';

                const email = document.getElementById('email').value.trim();

                btn.textContent = 'Enviando…';
                btn.disabled = true;

                try {
                    const data = await api.auth.olvidePassword(email);
                    exitoEl.textContent = data.message;
                    exitoEl.className = 'form-exito form-exito--visible';
                    btn.textContent = 'Enviar de nuevo';
                } catch (err) {
                    errorEl.textContent = err.message || 'No se ha podido enviar el enlace';
                    errorEl.className = 'form-error form-error--visible';
                    btn.textContent = 'Enviar enlace';
                } finally {
                    btn.disabled = false;
                }
            });
        });
    </script>

</body>
</html>
